# Native Linux packages for cmux for linux.
#
# Upstream `main` ships the cmux TUI only through npm and PyPI. This workflow
# builds the distro-native formats — .deb, .rpm, AUR directory, AppImage and a
# portable tarball — for x86_64 and aarch64, and publishes them on
# `linux-v*` tags.
#
# This workflow belongs to the fork only. Upstream's own macOS and iOS
# workflows were removed along with the code they built.

name: linux-packages

on:
  push:
    branches: [linux]
    tags: ['linux-v*']
    paths:
      - 'cmux-tui/**'
      - 'gui/**'
      - 'packaging/linux/**'
      - 'ghostty'
      - '.github/workflows/linux-packages.yml'
  pull_request:
    branches: [linux]
    paths:
      - 'cmux-tui/**'
      - 'gui/**'
      - 'packaging/linux/**'
      - '.github/workflows/linux-packages.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the package version (default: derive from the nearest linux-v* tag)'
        required: false
        type: string

permissions:
  contents: read

env:
  ZIG_VERSION: '0.16.0'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          # ghostty supplies libghostty-vt; fetch-depth 0 lets resolve_version
          # see the nearest linux-v* tag.
          submodules: false
          fetch-depth: 0

      - name: Check out the ghostty submodule
        run: git submodule update --init --filter=blob:none ghostty

      # bindgen needs clang's builtin header directory. Ubuntu's libclang
      # runtime package alone is not enough: without libclang-*-dev the
      # ghostty-vt-sys build fails with "'limits.h' file not found".
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev dpkg-dev fakeroot libgtk-4-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cmux-tui -> target
            gui -> target

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          case "${{ matrix.arch }}" in
            x86_64)  zig_arch=x86_64 ;;
            aarch64) zig_arch=aarch64 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz"
          curl -fSL --retry 3 -o /tmp/zig.tar.xz "$url"
          mkdir -p "$HOME/.local/opt"
          tar xf /tmp/zig.tar.xz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/zig-${zig_arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          zig version
          cargo --version
          clang --version | head -1

      - name: Build packages
        env:
          CMUX_VERSION: ${{ inputs.version }}
          # Reproducible archive timestamps.
          SOURCE_DATE_EPOCH: '0'
        run: packaging/linux/build-all.sh tarball deb rpm aur appimage

      - name: Install-test the .deb
        if: matrix.arch == 'x86_64'
        run: |
          mapfile -t debs < <(find build/linux/dist -name '*.deb' -type f)
          test "${#debs[@]}" -eq 1
          sudo apt-get install -y -qq "$PWD/${debs[0]}"
          command -v cmux
          command -v cmux-gtk
          cmux --version || true
          man --where cmux
          dpkg -L cmux | sort
          dpkg -s cmux
          dpkg -s cmux | sed -n '/^Depends:/p' | grep -qi 'libgtk'
          sudo apt-get remove -y -qq cmux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmux-linux-${{ matrix.arch }}
          # The AUR PKGBUILD is deliberately not uploaded here. build-aur.sh
          # can only fill in the sha256 of tarballs present on the machine, so
          # a per-arch PKGBUILD would carry 'SKIP' for the other architecture.
          # The release job renders it once, after both tarballs exist.
          path: build/linux/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The packaging scripts are needed to render the AUR PKGBUILD; the
      # binaries themselves come from the build jobs.
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p build/linux/dist
          # upload-artifact preserved the build/linux/dist prefix inside each
          # artifact; flatten both architectures into one directory.
          find artifacts -type f -exec cp -n {} build/linux/dist/ \;
          ls -la build/linux/dist

      - name: Render the AUR PKGBUILD with both architectures' digests
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          CMUX_VERSION="${TAG_NAME#linux-v}" packaging/linux/build-aur.sh
          cp build/linux/aur/PKGBUILD build/linux/dist/PKGBUILD
          grep '^sha256sums' build/linux/dist/PKGBUILD
          # A digest left as SKIP means a tarball was missing; that PKGBUILD
          # would silently skip integrity checking for that architecture.
          if grep -q "^sha256sums.*'SKIP'" build/linux/dist/PKGBUILD; then
            echo "::error::PKGBUILD still contains a SKIP digest" >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          find build/linux/dist -type f -print
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cmux for linux $TAG_NAME" \
            --notes "Native Linux packages built from the cmux for linux fork.

          Formats: \`.deb\`, \`.rpm\`, AppImage, portable tarball, and the AUR \`PKGBUILD\`.
          Every artifact has a matching \`.sha256\`.

          Each artifact ships the Rust \`cmux-tui\` multiplexer, \`cmux-relay\`, and the
          \`cmux-gtk\` GTK4 frontend. The macOS Swift application is not part of this fork." \
            $(find build/linux/dist -type f | sort)
